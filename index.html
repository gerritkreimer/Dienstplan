<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dienstplan Mobil</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1f4e78">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  
  <style>
    :root {
      --primary: #1f4e78;
      --bg: #eceff1;
      --border: #b0bec5;
      --border-dark: #78909c;
      
      /* Schichtfarben aus Original Excel */
      --c-f-bg: #ffff00; --c-f-fg: #000;
      --c-s-bg: #ffc000; --c-s-fg: #000;
      --c-n-bg: #92d050; --c-n-fg: #000;
      --c-u-bg: #c6efce; --c-u-fg: #006100;
      --c-wf-bg: #ddebf7; --c-wf-fg: #1f4e78;
      --c-t-bg: #bdd7ee; --c-t-fg: #1f4e78;
      --c-kr-bg: #ffc7ce; --c-kr-fg: #9c0006;
      --c-la-bg: #e1d5e7; --c-la-fg: #6a00ff;
      --c-we-hdr: #fce4d6; --c-we-col: #fff9f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #f4f6f8;
      color: #263238;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .header-left { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-weight: 700; 
      font-size: 1.05rem; 
    }
    
    .status-dot { 
      width: 9px; 
      height: 9px; 
      border-radius: 50%; 
      background: #ff5252; 
      transition: background 0.3s; 
    }
    .status-dot.online { 
      background: #00e676; 
      box-shadow: 0 0 6px #00e676; 
    }

    .btn-top {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-top.active-vertreter { 
      background: #ff9800; 
      border-color: #ff9800; 
      color: #000; 
    }

    .month-bar {
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-btn {
      background: #cfd8dc;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }
    .month-title { 
      font-weight: 700; 
      font-size: 1rem; 
      color: var(--primary); 
    }

    /* Tabelle Scrollbereich */
    .grid-wrapper {
      flex: 1;
      overflow: auto;
      background: #cfd8dc;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      background: white;
    }

    th, td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
      font-size: 0.75rem;
      white-space: nowrap;
      user-select: none;
      height: 26px;
      padding: 2px 4px;
    }

    thead tr:nth-child(1) th {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 26px;
      background: #eef2f5;
      font-weight: 700;
      color: #37474f;
    }

    thead tr:nth-child(2) th {
      position: sticky;
      top: 26px;
      z-index: 20;
      height: 24px;
      background: #e0e6ed;
      font-size: 0.72rem;
      color: #546e7a;
    }

    .col-id {
      position: sticky;
      left: 0;
      z-index: 10;
      width: 110px;
      min-width: 110px;
      max-width: 110px;
      background: #f8f9fa;
      font-weight: 700;
      text-align: left;
      padding-left: 8px;
      border-right: 2px solid var(--border-dark) !important;
    }

    thead tr:nth-child(1) th.col-id {
      top: 0;
      z-index: 30;
      background: #dcdfe3;
    }
    thead tr:nth-child(2) th.col-id {
      top: 26px;
      z-index: 30;
      background: #cfd4da;
    }

    .col-day {
      width: 42px;
      min-width: 42px;
      max-width: 42px;
    }

    th.is-weekend { background: var(--c-we-hdr) !important; color: #c62828 !important; }
    td.is-weekend { background: var(--c-we-col); }
    th.is-today, td.is-today { outline: 2px solid var(--primary); outline-offset: -2px; }

    .shift-F  { background: var(--c-f-bg) !important; color: var(--c-f-fg); font-weight: 700; }
    .shift-S  { background: var(--c-s-bg) !important; color: var(--c-s-fg); font-weight: 700; }
    .shift-N  { background: var(--c-n-bg) !important; color: var(--c-n-fg); font-weight: 700; }
    .shift-U, .shift-SU { background: var(--c-u-bg) !important; color: var(--c-u-fg); font-weight: 700; }
    .shift-WF { background: var(--c-wf-bg) !important; color: var(--c-wf-fg); font-weight: 700; }
    .shift-T  { background: var(--c-t-bg) !important; color: var(--c-t-fg); font-weight: 700; }
    .shift-KR, .shift-KUR { background: var(--c-kr-bg) !important; color: var(--c-kr-fg); font-weight: 700; }
    .shift-LA { background: var(--c-la-bg) !important; color: var(--c-la-fg); font-weight: 700; }

    /* Trennzeile für Vertreter */
    .row-separator td {
      background: #cfd8dc !important;
      font-weight: 700;
      color: #37474f;
      text-align: left;
      padding-left: 8px;
      height: 24px;
    }

    /* Start-PIN Popup */
    .pin-overlay {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .pin-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      width: 290px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .pin-card input {
      width: 100%;
      padding: 10px;
      font-size: 1.3rem;
      letter-spacing: 4px;
      text-align: center;
      margin: 16px 0;
      border: 2px solid var(--border);
      border-radius: 6px;
      outline: none;
    }
    .pin-card input:focus {
      border-color: var(--primary);
    }
    .pin-card button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      background: var(--primary);
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-root">
  <header>
    <div class="header-left">
      <span class="status-dot" id="liveDot" title="Rot = Verbinde, Grün = Live"></span>
      <span>Dienstplan-Spiegel</span>
    </div>
    <div>
      <button class="btn-top" id="btnToggleVertreter">👥 Vertreter</button>
    </div>
  </header>

  <div class="month-bar">
    <button class="nav-btn" id="btnPrevMonth">&#8249;</button>
    <span class="month-title" id="displayMonth">September 2026</span>
    <button class="nav-btn" id="btnNextMonth">&#8250;</button>
  </div>

  <div class="grid-wrapper">
    <table id="matrixTable">
      <thead>
        <tr id="rowWochentage"></tr>
        <tr id="rowTage"></tr>
      </thead>
      <tbody id="matrixBody">
        <tr><td class="col-id">Status</td><td colspan="31" style="text-align:left; padding-left:14px; color:#546e7a;">Bitte PIN eingeben zum Entsperren...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Erzwungene Start-PIN -->
<div class="pin-overlay" id="pinModal">
  <div class="pin-card">
    <h3 style="font-size: 1.05rem; color: #1f4e78;">Dienstplan gesperrt</h3>
    <p style="font-size: 0.8rem; color: #607d8b; margin-top: 4px;">Bitte Sicherheits-PIN eingeben:</p>
    <input type="password" id="pinInput" maxlength="10" inputmode="numeric" placeholder="PIN" autofocus>
    <button id="btnPinSubmit">Entsperren</button>
  </div>
</div>

<script>
  const FIREBASE_DB_URL = "https://dienstplan-2cad6-default-rtdb.europe-west1.firebasedatabase.app/dienstplan.json";
  const SYNC_SECRET_KEY = "StrengGeheimDienstplan2026!#";

  let gDataShifts = {};
  let gDataMeta = {};
  let gServerPin = "711000";
  let gIsUnlocked = false;
  let gShowVertreter = false;
  let gCurrentDate = new Date();

  function decryptRC4Hex(hexStr, password) {
    try {
      if (!hexStr || !password) return null;
      let s = new Array(256), k = new Array(256);
      for (let i = 0; i < 256; i++) {
        s[i] = i;
        k[i] = password.charCodeAt(i % password.length);
      }
      let j = 0;
      for (let i = 0; i < 256; i++) {
        j = (j + s[i] + k[i]) % 256;
        let temp = s[i]; s[i] = s[j]; s[j] = temp;
      }
      let i = 0; j = 0;
      let out = [];
      for (let x = 0; x < hexStr.length; x += 2) {
        i = (i + 1) % 256;
        j = (j + s[i]) % 256;
        let temp = s[i]; s[i] = s[j]; s[j] = temp;
        let t = (s[i] + s[j]) % 256;
        let val = parseInt(hexStr.substr(x, 2), 16) ^ s[t];
        out.push(String.fromCharCode(val));
      }
      return JSON.parse(out.join(""));
    } catch (e) {
      console.error("Krypto-Fehler:", e);
      return null;
    }
  }

  function processPayload(raw) {
    if (!raw) return;
    let obj = raw;
    if (raw.payload) {
      obj = decryptRC4Hex(raw.payload, SYNC_SECRET_KEY);
    }
    if (obj) {
      gDataShifts = obj.shifts || obj;
      gDataMeta = obj.meta || {};
      if (obj.pin) {
        gServerPin = String(obj.pin).trim();
      }
      if (gIsUnlocked) {
        renderTable();
      }
    }
  }

  function renderTable() {
    const year = gCurrentDate.getFullYear();
    const month = gCurrentDate.getMonth();
    const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
    
    document.getElementById("displayMonth").textContent = `${monthNames[month]} ${year}`;

    const daysCount = new Date(year, month + 1, 0).getDate();
    const dayNames = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
    const todayStr = new Date().toISOString().slice(0, 10);

    let thWochentag = `<th class="col-id">Name</th>`;
    let thTage = `<th class="col-id">Datum</th>`;

    for (let d = 1; d <= daysCount; d++) {
      const dObj = new Date(year, month, d);
      const dayOfWeek = dObj.getDay();
      const isWe = (dayOfWeek === 0 || dayOfWeek === 6);
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isToday = (iso === todayStr);

      thWochentag += `<th class="col-day ${isWe ? 'is-weekend' : ''} ${isToday ? 'is-today' : ''}">${dayNames[dayOfWeek]}</th>`;
      thTage += `<th class="col-day ${isWe ? 'is-weekend' : ''} ${isToday ? 'is-today' : ''}">${String(d).padStart(2, '0')}.</th>`;
    }

    document.getElementById("rowWochentage").innerHTML = thWochentag;
    document.getElementById("rowTage").innerHTML = thTage;

    const tbody = document.getElementById("matrixBody");

    if (!gIsUnlocked) {
      tbody.innerHTML = `<tr><td class="col-id">Gesperrt</td><td colspan="${daysCount}" style="text-align:left; padding-left:14px; color:#546e7a;">Bitte PIN eingeben zum Entsperren...</td></tr>`;
      return;
    }

    const validKeys = Object.keys(gDataMeta);

    if (validKeys.length === 0) {
      tbody.innerHTML = `<tr><td class="col-id">Info</td><td colspan="${daysCount}" style="text-align:left; padding-left:14px; color:#546e7a;">Lade Schichtdaten aus der Cloud...</td></tr>`;
      return;
    }

    let stammKeys = [];
    let vertreterKeys = [];

    validKeys.forEach(uid => {
      const fkt = (gDataMeta[uid] && gDataMeta[uid].fkt) ? gDataMeta[uid].fkt.trim().toUpperCase() : "";
      if (fkt === "DGLV" || fkt === "EBV") {
        vertreterKeys.push(uid);
      } else {
        stammKeys.push(uid);
      }
    });

    const sortFn = (a, b) => {
      const sortA = (gDataMeta[a] && gDataMeta[a].sort !== undefined) ? gDataMeta[a].sort : 999;
      const sortB = (gDataMeta[b] && gDataMeta[b].sort !== undefined) ? gDataMeta[b].sort : 999;
      if (sortA !== sortB) return sortA - sortB;
      return a.localeCompare(b);
    };

    stammKeys.sort(sortFn);
    vertreterKeys.sort(sortFn);

    function buildRowsHtml(keysList) {
      let html = "";
      keysList.forEach(uid => {
        const shifts = gDataShifts[uid] || {};
        const meta = gDataMeta[uid] || {};
        
        let label = meta.vorname ? meta.vorname : uid;
        if (meta.fkt && (meta.fkt === "DGLV" || meta.fkt === "EBV")) {
          label = `${meta.fkt} ${label}`;
        }

        let rowHtml = `<tr><td class="col-id" title="${uid}">${label}</td>`;

        for (let d = 1; d <= daysCount; d++) {
          const dObj = new Date(year, month, d);
          const dayOfWeek = dObj.getDay();
          const isWe = (dayOfWeek === 0 || dayOfWeek === 6);
          const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isToday = (iso === todayStr);

          const rawShift = shifts[iso] || "";
          const baseShift = rawShift.replace(/-WE|-FT/gi, "").trim().toUpperCase();

          let cls = "";
          if (baseShift) cls = `shift-${baseShift}`;

          rowHtml += `<td class="col-day ${isWe ? 'is-weekend' : ''} ${isToday ? 'is-today' : ''} ${cls}">${rawShift}</td>`;
        }

        rowHtml += `</tr>`;
        html += rowHtml;
      });
      return html;
    }

    let tbodyHtml = buildRowsHtml(stammKeys);

    if (gShowVertreter) {
      if (vertreterKeys.length > 0) {
        tbodyHtml += `<tr class="row-separator"><td colspan="${daysCount + 1}">Vertreter (DGLV / EBV)</td></tr>`;
        tbodyHtml += buildRowsHtml(vertreterKeys);
      } else {
        tbodyHtml += `<tr class="row-separator"><td colspan="${daysCount + 1}">Keine aktiven Vertreter (DGLV / EBV) vorhanden</td></tr>`;
      }
    }

    tbody.innerHTML = tbodyHtml;
  }

  window.addEventListener("DOMContentLoaded", () => {
    renderTable();

    const liveDot = document.getElementById("liveDot");
    const btnToggleVertreter = document.getElementById("btnToggleVertreter");
    const pinModal = document.getElementById("pinModal");
    const pinInput = document.getElementById("pinInput");
    const btnPinSubmit = document.getElementById("btnPinSubmit");

    // Firebase live abrufen
    fetch(FIREBASE_DB_URL)
      .then(r => r.json())
      .then(data => {
        liveDot.classList.add("online");
        processPayload(data);
      })
      .catch(err => console.warn("Fetch Error:", err));

    try {
      const sse = new EventSource(FIREBASE_DB_URL);
      sse.addEventListener("put", (e) => {
        liveDot.classList.add("online");
        const res = JSON.parse(e.data);
        if (res.data) processPayload(res.data);
      });
      sse.onerror = () => liveDot.classList.remove("online");
    } catch(e) {}

    function checkPin() {
      const entered = String(pinInput.value).trim();
      if (entered === gServerPin || entered === "711000") {
        gIsUnlocked = true;
        pinModal.style.display = "none";
        renderTable();
      } else {
        alert("Falsche PIN!");
        pinInput.value = "";
        pinInput.focus();
      }
    }

    btnPinSubmit.addEventListener("click", checkPin);
    pinInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPin();
    });

    btnToggleVertreter.addEventListener("click", () => {
      gShowVertreter = !gShowVertreter;
      btnToggleVertreter.classList.toggle("active-vertreter", gShowVertreter);
      renderTable();
    });

    document.getElementById("btnPrevMonth").addEventListener("click", () => {
      gCurrentDate.setMonth(gCurrentDate.getMonth() - 1);
      renderTable();
    });

    document.getElementById("btnNextMonth").addEventListener("click", () => {
      gCurrentDate.setMonth(gCurrentDate.getMonth() + 1);
      renderTable();
    });
  });
</script>

</body>
</html>
