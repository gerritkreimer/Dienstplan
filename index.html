<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dienstplan Mobil</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1f4e78">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  
  <style>
    :root {
      --primary: #1f4e78;
      --bg: #eceff1;
      --border: #b0bec5;
      --border-dark: #78909c;
      
      /* Schichtfarben aus Original Excel */
      --c-f-bg: #ffff00; --c-f-fg: #000;
      --c-s-bg: #ffc000; --c-s-fg: #000;
      --c-n-bg: #92d050; --c-n-fg: #000;
      --c-u-bg: #c6efce; --c-u-fg: #006100;
      --c-wf-bg: #ddebf7; --c-wf-fg: #1f4e78;
      --c-t-bg: #bdd7ee; --c-t-fg: #1f4e78;
      --c-kr-bg: #ffc7ce; --c-kr-fg: #9c0006;
      --c-la-bg: #e1d5e7; --c-la-fg: #6a00ff;
      --c-we-hdr: #fce4d6; --c-we-col: #fff9f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #f4f6f8;
      color: #263238;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .header-left { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-weight: 700; 
      font-size: 1.05rem; 
    }
    
    .status-dot { 
      width: 9px; 
      height: 9px; 
      border-radius: 50%; 
      background: #ff5252; 
      transition: background 0.3s; 
    }
    .status-dot.online { 
      background: #00e676; 
      box-shadow: 0 0 6px #00e676; 
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-top {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-top.active-vertreter { 
      background: #ff9800; 
      border-color: #ff9800; 
      color: #000; 
    }

    .month-bar {
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-btn {
      background: #cfd8dc;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }
    .month-title { 
      font-weight: 700; 
      font-size: 1rem; 
      color: var(--primary); 
      cursor: pointer;
      user-select: none;
    }

    /* Tabelle Scrollbereich */
    .grid-wrapper {
      flex: 1;
      overflow: auto;
      background: #cfd8dc;
      position: relative;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      background: white;
    }

    th, td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
      font-size: 0.75rem;
      white-space: nowrap;
      user-select: none;
      height: 26px;
      padding: 2px 4px;
    }

    thead tr:nth-child(1) th {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 26px;
      background: #eef2f5;
      font-weight: 700;
      color: #37474f;
    }

    thead tr:nth-child(2) th {
      position: sticky;
      top: 26px;
      z-index: 20;
      height: 24px;
      background: #e0e6ed;
      font-size: 0.72rem;
      color: #546e7a;
    }

    .col-id {
      position: sticky;
      left: 0;
      z-index: 10;
      width: 115px;
      min-width: 115px;
      max-width: 115px;
      background: #f8f9fa;
      font-weight: 700;
      text-align: left;
      padding-left: 8px;
      border-right: 2px solid var(--border-dark) !important;
      cursor: pointer;
    }
    .col-id:hover {
      background: #eceff1;
    }

    thead tr:nth-child(1) th.col-id {
      top: 0;
      z-index: 30;
      background: #dcdfe3;
      cursor: default;
    }
    thead tr:nth-child(2) th.col-id {
      top: 26px;
      z-index: 30;
      background: #cfd4da;
      cursor: default;
    }

    .col-day {
      width: 54px;
      min-width: 54px;
      max-width: 54px;
    }

    th.is-weekend { background: var(--c-we-hdr) !important; color: #c62828 !important; }
    td.is-weekend { background: var(--c-we-col); }
    
    /* Dicker blauer Rahmen für den heutigen Tag */
    th.is-today { 
      outline: 2px solid #0056b3 !important; 
      outline-offset: -2px; 
      background-color: #bbdefb !important;
      font-weight: 900 !important;
    }
    td.is-today { 
      box-shadow: inset 2px 0 0 0 #0056b3, inset -2px 0 0 0 #0056b3;
    }
    td.is-today:not([class*="shift-"]) {
      background-color: #f1f8fe;
    }

    /* Schicht-Farben */
    .shift-F  { background: var(--c-f-bg) !important; color: var(--c-f-fg) !important; font-weight: 700; }
    .shift-S  { background: var(--c-s-bg) !important; color: var(--c-s-fg) !important; font-weight: 700; }
    .shift-N  { background: var(--c-n-bg) !important; color: var(--c-n-fg) !important; font-weight: 700; }
    .shift-U, .shift-SU { background: var(--c-u-bg) !important; color: var(--c-u-fg) !important; font-weight: 700; }
    .shift-WF { background: var(--c-wf-bg) !important; color: var(--c-wf-fg) !important; font-weight: 700; }
    .shift-T  { background: var(--c-t-bg) !important; color: var(--c-t-fg) !important; font-weight: 700; }
    .shift-KR, .shift-KUR { background: var(--c-kr-bg) !important; color: var(--c-kr-fg) !important; font-weight: 700; }
    .shift-LA { background: var(--c-la-bg) !important; color: var(--c-la-fg) !important; font-weight: 700; }

    /* Kompakte Darstellung bei LA mit Zeitangaben */
    td.col-day.shift-LA {
      font-size: 0.62rem;
      padding: 1px 0px;
      letter-spacing: -0.4px;
      font-weight: 700;
    }

    /* Trennzeile & Header zwischen den Funktionsbereichen */
    .row-group-header td {
      background: #37474f !important;
      color: #ffffff !important;
      font-weight: 800;
      font-size: 0.72rem;
      letter-spacing: 1px;
      text-align: left;
      padding-left: 10px;
      height: 22px;
      border-top: 3px solid #212121 !important;
      border-bottom: 1px solid #263238 !important;
      cursor: default;
    }

    /* Modals (PIN & Export) */
    .pin-overlay {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .pin-card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      text-align: center;
      width: 310px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .pin-card input {
      width: 100%;
      padding: 10px;
      font-size: 1.1rem;
      text-align: center;
      margin: 14px 0;
      border: 2px solid var(--border);
      border-radius: 6px;
      outline: none;
      text-transform: uppercase;
    }
    .pin-card input:focus {
      border-color: var(--primary);
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-action {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      background: var(--primary);
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-action.whatsapp {
      background: #25D366;
      color: white;
    }
    .btn-action.secondary {
      background: #eceff1;
      color: #37474f;
    }
  </style>
</head>
<body>

<div class="app-root">
  <header>
    <div class="header-left">
      <span class="status-dot" id="liveDot" title="Rot = Verbinde, Grün = Live"></span>
      <span>Dienstplan-Spiegel</span>
    </div>
    <div class="header-actions">
      <button class="btn-top" id="btnGoToday" title="Zum heutigen Tag springen">📅 Heute</button>
      <button class="btn-top" id="btnToggleVertreter">👥 Vertreter</button>
    </div>
  </header>

  <div class="month-bar">
    <button class="nav-btn" id="btnPrevMonth">&#8249;</button>
    <span class="month-title" id="displayMonth" title="Klicken, um zum heutigen Tag zu springen">September 2026</span>
    <button class="nav-btn" id="btnNextMonth">&#8250
