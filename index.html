<script>
  const FIREBASE_DB_URL = "https://dienstplan-2cad6-default-rtdb.europe-west1.firebasedatabase.app/dienstplan.json";
  
  // WICHTIG: Exakt dasselbe Passwort wie in Excel VBA eintragen:
  const SYNC_SECRET_KEY = "StrengGeheimDienstplan2026!#";

  let gAllData = {};
  let gCurrentDate = new Date();
  let gSelectedKennung = localStorage.getItem("dp_mobile_kennung") || "";

  const displayMonth = document.getElementById("displayMonth");
  const scheduleContainer = document.getElementById("scheduleContainer");
  const liveDot = document.getElementById("liveDot");
  const inputKennung = document.getElementById("inputKennung");
  const btnSaveKennung = document.getElementById("btnSaveKennung");
  const labelUser = document.getElementById("labelUser");

  if (gSelectedKennung) {
    inputKennung.value = gSelectedKennung;
    labelUser.textContent = `ID: ${gSelectedKennung}`;
  }

  // --- NATIVE ENTSCHLÜSSELUNG (RC4 Hex zu Klartext-JSON) ---
  function decryptRC4Hex(hexStr, password) {
    try {
      if (!hexStr || !password) return null;
      let s = new Array(256);
      let k = new Array(256);
      for (let i = 0; i < 256; i++) {
        s[i] = i;
        k[i] = password.charCodeAt(i % password.length);
      }
      let j = 0;
      for (let i = 0; i < 256; i++) {
        j = (j + s[i] + k[i]) % 256;
        let temp = s[i]; s[i] = s[j]; s[j] = temp;
      }
      let i = 0; j = 0;
      let outChars = [];
      for (let x = 0; x < hexStr.length; x += 2) {
        i = (i + 1) % 256;
        j = (j + s[i]) % 256;
        let temp = s[i]; s[i] = s[j]; s[j] = temp;
        let t = (s[i] + s[j]) % 256;

        let cipherByte = parseInt(hexStr.substr(x, 2), 16);
        let plainByte = cipherByte ^ s[t];
        outChars.push(String.fromCharCode(plainByte));
      }
      const jsonText = outChars.join("");
      return JSON.parse(jsonText);
    } catch (err) {
      console.error("Entschlüsselung fehlgeschlagen:", err);
      return null;
    }
  }

  function processReceivedData(rawData) {
    if (!rawData) return;
    
    // Prüfen, ob die Daten verschlüsselt vorliegen:
    if (rawData.payload) {
      const decrypted = decryptRC4Hex(rawData.payload, SYNC_SECRET_KEY);
      if (decrypted) {
        gAllData = decrypted;
      }
    } else {
      // Fallback: Falls noch unverschlüsselte Altdaten in Firebase liegen
      gAllData = rawData;
    }
    renderSchedule();
  }

  // --- ECHTZEIT-STREAM AUS FIREBASE ---
  function startFirebaseSync() {
    const sse = new EventSource(FIREBASE_DB_URL);

    sse.addEventListener("put", (e) => {
      liveDot.classList.add("online");
      const res = JSON.parse(e.data);
      if (res.path === "/" && res.data) {
        processReceivedData(res.data);
      } else if (res.data) {
        // Falls direkte Teil-Payloads aktualisiert werden
        fetchInitialData();
      }
    });

    sse.onerror = () => {
      liveDot.classList.remove("online");
    };
  }

  async function fetchInitialData() {
    try {
      const res = await fetch(FIREBASE_DB_URL);
      if (res.ok) {
        const raw = await res.json();
        liveDot.classList.add("online");
        processReceivedData(raw);
      }
    } catch (err) {
      console.warn("Initialer Fetch fehlgeschlagen:", err);
    }
  }

  // --- RENDERING LOGIK ---
  function renderSchedule() {
    if (!gSelectedKennung) {
      scheduleContainer.innerHTML = '<div class="empty-state">Bitte gib oben deine 3 Ziffern ein.</div>';
      return;
    }

    const year = gCurrentDate.getFullYear();
    const month = gCurrentDate.getMonth();
    
    const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
    displayMonth.textContent = `${monthNames[month]} ${year}`;

    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const dayNames = ["SO", "MO", "DI", "MI", "DO", "FR", "SA"];
    const todayStr = new Date().toISOString().slice(0, 10);

    const userShifts = gAllData[gSelectedKennung] || {};
    let html = "";

    for (let day = 1; day <= daysInMonth; day++) {
      const dayDate = new Date(year, month, day);
      const isoDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dayOfWeek = dayDate.getDay();
      const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
      const isToday = (isoDate === todayStr);

      const rawShift = userShifts[isoDate] || "";
      const baseShift = rawShift.replace(/-WE|-FT/gi, "").trim().toUpperCase();

      let badgeClass = "day-badge";
      if (baseShift) {
        badgeClass += ` badge-${baseShift}`;
      }

      html += `
        <div class="day-row ${isWeekend ? 'is-weekend' : ''} ${isToday ? 'is-today' : ''}">
          <div class="day-date-group">
            <span class="day-name">${dayNames[dayOfWeek]}</span>
            <span class="day-num">${day}.</span>
          </div>
          <span class="${badgeClass}">${rawShift || "—"}</span>
        </div>
      `;
    }

    scheduleContainer.innerHTML = html;
  }

  // --- INTERAKTION ---
  btnSaveKennung.addEventListener("click", () => {
    const val = inputKennung.value.trim().padStart(3, "0");
    if (val.length === 3) {
      gSelectedKennung = val;
      localStorage.setItem("dp_mobile_kennung", val);
      labelUser.textContent = `ID: ${val}`;
      renderSchedule();
    }
  });

  inputKennung.addEventListener("keydown", (e) => {
    if (e.key === "Enter") btnSaveKennung.click();
  });

  document.getElementById("btnPrevMonth").addEventListener("click", () => {
    gCurrentDate.setMonth(gCurrentDate.getMonth() - 1);
    renderSchedule();
  });

  document.getElementById("btnNextMonth").addEventListener("click", () => {
    gCurrentDate.setMonth(gCurrentDate.getMonth() + 1);
    renderSchedule();
  });

  // Start
  fetchInitialData();
  startFirebaseSync();
</script>
